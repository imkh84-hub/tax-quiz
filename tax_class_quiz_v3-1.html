<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>찾아가는 맞춤형 세금교실 V3</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--line:#dbe3ef}
*{box-sizing:border-box} body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:820px;margin:auto;padding:18px}
.hero{background:linear-gradient(135deg,#123b7a,#2869d1);color:#fff;border-radius:22px;padding:24px;margin-bottom:16px}
.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;line-height:1.6}
.card{background:var(--card);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.hidden{display:none}.badge{display:inline-block;background:#eef5ff;color:#1d4ed8;border-radius:999px;padding:8px 12px;font-weight:800;margin-bottom:12px}
label{display:block;font-weight:700;margin:10px 0 6px} input,select{width:100%;padding:13px;border:1px solid #cfd8e3;border-radius:12px;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btns{display:flex;gap:10px;margin-top:16px}
button{border:none;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:#fff}.secondary{background:#e8edf5}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:12px 0 18px}
.progress>div{height:100%;background:var(--blue);width:0;transition:.25s}.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.question{font-size:21px;line-height:1.55;font-weight:800;margin:10px 0 14px}
.choices button{width:100%;display:block;text-align:left;background:#fff;border:1px solid #d7dee8;margin:8px 0;padding:14px;border-radius:12px;font-weight:600}
.choices button:hover{background:#eef5ff;border-color:#a9c5ff}
.feedback{margin-top:14px;padding:16px;border-radius:14px;line-height:1.6}.correct{background:#ecfdf3;border:1px solid #a7f3d0}.wrong{background:#fef2f2;border:1px solid #fecaca}
.scorebox{text-align:center;padding:20px;background:#f8fafc;border-radius:16px}.score{font-size:46px;font-weight:900}.rank{font-size:24px;font-weight:900;margin-top:6px}
.compare{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:8px;align-items:center}.compare div{padding:10px;border-bottom:1px solid #eef2f7}
.head{font-weight:800;background:#f8fafc;border-radius:8px}.up{font-weight:900}.notice{background:#fff8e8;border:1px solid #f3dfad;border-radius:14px;padding:14px;line-height:1.6}
.small{font-size:13px;color:var(--muted);line-height:1.6}
@media(max-width:620px){.row{grid-template-columns:1fr}.hero h1{font-size:24px}.question{font-size:19px}.compare{grid-template-columns:1fr 1fr 1fr}.compare .label{grid-column:1/-1;background:#f8fafc;border-radius:8px;font-weight:800}}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
  <h1>🧾 찾아가는 맞춤형 세금교실 V3</h1>
  <p>객관식 퀴즈 · 즉시 정답/오답 · 해설 · 사전/사후 학습효과 비교</p>
</div>

<section id="setup" class="card">
  <div class="badge">STEP 1. 참여 정보</div>
  <div class="row">
    <div><label>학교명</label><input id="school" placeholder="예: ○○초등학교"></div>
    <div><label>학년</label>
      <select id="grade">
        <option value="">선택</option><option>초등 1학년</option><option>초등 2학년</option><option>초등 3학년</option>
        <option>초등 4학년</option><option>초등 5학년</option><option>초등 6학년</option>
      </select>
    </div>
  </div>
  <label>학생 번호 또는 별칭</label><input id="student" placeholder="예: 01번 / 세금탐험가A">
  <div class="notice" style="margin-top:14px">이름 대신 번호·별칭 사용을 권장합니다.</div>
  <div class="btns"><button class="primary" onclick="startQuiz('pre')">사전 퀴즈 시작</button></div>
</section>

<section id="quiz" class="card hidden">
  <div class="qmeta"><span id="phaseText"></span><span id="qcount"></span></div>
  <div class="progress"><div id="bar"></div></div>
  <div id="question" class="question"></div>
  <div id="choices" class="choices"></div>
  <div id="feedback" class="feedback hidden"></div>
  <div class="btns"><button id="nextBtn" class="primary hidden" onclick="nextQuestion()">다음 문제</button></div>
</section>

<section id="preResult" class="card hidden">
  <div class="badge">STEP 2. 사전 퀴즈 결과</div>
  <div class="scorebox">
    <div id="preScore" class="score"></div>
    <div id="preRank" class="rank"></div>
    <p id="preMsg"></p>
  </div>
  <div class="notice" style="margin-top:14px">이제 세금교실 수업을 진행한 뒤, 사후 퀴즈로 학습효과를 확인하세요.</div>
  <div class="btns"><button class="primary" onclick="startQuiz('post')">교육 후 사후 퀴즈 시작</button></div>
</section>

<section id="finalResult" class="card hidden">
  <div class="badge">STEP 3. 교육효과 비교</div>
  <h2 id="title"></h2>
  <div class="compare">
    <div class="head">구분</div><div class="head">사전</div><div class="head">사후</div><div class="head">향상</div>
    <div class="label">정답 수</div><div id="preCorrect"></div><div id="postCorrect"></div><div id="gainCorrect" class="up"></div>
    <div class="label">점수</div><div id="prePoints"></div><div id="postPoints"></div><div id="gainPoints" class="up"></div>
  </div>
  <div id="finalComment" class="notice" style="margin-top:16px"></div>
  <div class="btns">
    <button class="secondary" onclick="location.reload()">새 학생 시작</button>
    <button class="primary" onclick="saveResult()">결과표 저장</button>
  </div>
  <p class="small">※ 교육용 예시 프로그램입니다. 실제 운영 전에는 문항·표현·세법 관련 내용에 대해 기관 내부 검토를 거쳐 사용하세요.</p>
</section>
</div>

<script>
const preQuestions = [
 {q:"우리나라의 내국세를 부과·징수하는 기관은 어디일까요?", c:["관세청","국세청","시청","경찰서"], a:1, e:"국세청은 소득세·법인세·부가가치세 등 내국세 행정을 담당합니다."},
 {q:"해외에서 물건을 들여올 때 부과되는 관세를 담당하는 기관은?", c:["국세청","관세청","교육청","소방청"], a:1, e:"관세청은 관세의 부과·징수와 수출입 통관 업무를 담당합니다."},
 {q:"다음 중 세금으로 운영되는 공공서비스와 가장 관련이 적은 것은?", c:["소방서비스","도로 건설","학교 운영","개인의 게임 아이템 구입"], a:3, e:"세금은 공공서비스와 공동체 운영에 사용됩니다. 개인의 게임 아이템 구입은 개인 소비입니다."},
 {q:"우리가 물건을 살 때 가격에 포함되어 있는 경우가 많은 세금은?", c:["상속세","부가가치세","증여세","종합부동산세"], a:1, e:"부가가치세는 물건값에 포함되어 최종소비자가 부담하는 구조입니다."},
 {q:"다음 중 국세가 아닌 것은?", c:["소득세","법인세","부가가치세","자동차세"], a:3, e:"자동차세는 지방세입니다."},
 {q:"세금은 원하는 사람만 선택해서 내면 된다.", c:["맞다","틀리다"], a:1, e:"세금은 법에서 정한 요건에 해당하면 납세의무가 발생합니다."},
 {q:"사람이 사망하면서 재산이 가족 등에게 이전되는 경우 관계될 수 있는 세금은?", c:["상속세","부가가치세","관세","자동차세"], a:0, e:"사망으로 재산이 이전되는 경우에는 상속세가 관련될 수 있습니다."},
 {q:"부모님 등에게 재산을 무상으로 받는 경우 관계될 수 있는 세금은?", c:["부가가치세","증여세","자동차세","관세"], a:1, e:"재산을 무상으로 이전받는 경우 증여세가 관련될 수 있습니다."},
 {q:"다음 중 국세청에서 하는 일과 가장 가까운 것은?", c:["범죄자를 체포한다","화재를 진압한다","세금 신고·납부를 안내하고 세금을 부과·징수한다","학교 시험문제를 만든다"], a:2, e:"국세청은 국세의 신고·납부 안내와 부과·징수 등 세정 업무를 수행합니다."},
 {q:"세금과 관련된 개인정보는 누구에게나 자유롭게 알려줘도 된다.", c:["맞다","틀리다"], a:1, e:"세금 관련 정보는 보호되어야 하며 함부로 공개할 수 없습니다."}
];

const postQuestions = [
 {q:"소득세·법인세·부가가치세 같은 내국세 업무를 담당하는 기관은?", c:["국세청","관세청","경찰청","교육청"], a:0, e:"내국세 행정은 국세청이 담당합니다."},
 {q:"다음 중 지방세에 해당하는 것은?", c:["소득세","부가가치세","자동차세","법인세"], a:2, e:"자동차세는 지방세입니다."},
 {q:"부가가치세에 대한 설명으로 가장 알맞은 것은?", c:["물건이나 서비스 거래 과정에서 발생하는 부가가치에 과세하는 세금","자동차를 가진 사람에게만 부과되는 세금","해외여행을 할 때만 내는 세금","학교에서 내는 세금"], a:0, e:"부가가치세는 상품 거래나 서비스 제공 과정에서 발생하는 부가가치에 과세하는 세금입니다."},
 {q:"다음 중 관세청의 업무와 가장 가까운 것은?", c:["수출입 통관과 관세 업무","소방 업무","학교 교육과정 편성","주민등록 발급"], a:0, e:"관세청은 수출입 통관과 관세 행정을 담당합니다."},
 {q:"세금이 사용될 수 있는 곳으로 가장 알맞은 것은?", c:["도로와 복지","소방과 재난 대응","공공서비스","①②③ 모두"], a:3, e:"세금은 여러 공공서비스와 국가·지방자치단체의 기능을 유지하는 데 사용됩니다."},
 {q:"세금을 내는 사람도 세금과 관련된 설명을 듣고 정해진 절차에 따라 의견을 낼 수 있다.", c:["맞다","틀리다"], a:0, e:"납세자에게도 권리가 있으며 정해진 절차에 따라 권리구제를 받을 수 있습니다."},
 {q:"물건을 사고 받은 영수증은 거래금액이나 구입 사실을 확인하는 자료가 될 수 있다.", c:["맞다","틀리다"], a:0, e:"영수증은 거래 내용과 금액 등을 확인하는 자료가 될 수 있습니다."},
 {q:"아르바이트나 일을 해서 소득이 생기면 세금과 관련될 수 있다.", c:["맞다","틀리다"], a:0, e:"소득이 생기면 소득세 등 세금 문제와 관련될 수 있습니다."},
 {q:"성실한 납세와 가장 관련이 깊은 설명은?", c:["공공서비스를 함께 유지하는 데 기여한다","세금은 모두 개인에게 돌려준다","세금을 내면 모든 서비스가 무료가 된다","원하는 사람만 내면 된다"], a:0, e:"성실한 납세는 공동체의 공공서비스와 국가 운영을 뒷받침합니다."},
 {q:"다음 중 세금에 대한 태도로 가장 바람직한 것은?", c:["모르면 무조건 무시한다","필요하면 안내를 받고 정확히 신고·납부한다","다른 사람 정보도 자유롭게 본다","세금은 모두 같은 종류라고 생각한다"], a:1, e:"세금은 정확한 정보를 확인하고 필요한 경우 안내를 받아 성실히 신고·납부하는 것이 중요합니다."}
];

let phase='pre', qs=[], idx=0, score=0, preScore=0, postScore=0, locked=false;

function startQuiz(p){
 phase=p; qs=p==='pre'?preQuestions:postQuestions; idx=0; score=0; locked=false;
 document.getElementById("setup").classList.add("hidden");
 document.getElementById("preResult").classList.add("hidden");
 document.getElementById("finalResult").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 render();
}
function render(){
 locked=false;
 document.getElementById("feedback").classList.add("hidden");
 document.getElementById("nextBtn").classList.add("hidden");
 document.getElementById("phaseText").innerText=phase==='pre'?"사전 퀴즈":"사후 퀴즈";
 document.getElementById("qcount").innerText=`${idx+1} / ${qs.length}`;
 document.getElementById("bar").style.width=`${idx/qs.length*100}%`;
 document.getElementById("question").innerText=qs[idx].q;
 const box=document.getElementById("choices"); box.innerHTML="";
 qs[idx].c.forEach((t,i)=>{
   const b=document.createElement("button");
   b.innerText=`${i+1}. ${t}`; b.onclick=()=>choose(i,b);
   box.appendChild(b);
 });
}
function choose(i,btn){
 if(locked) return; locked=true;
 const q=qs[idx], ok=i===q.a;
 if(ok) score++;
 const fb=document.getElementById("feedback");
 fb.className="feedback "+(ok?"correct":"wrong");
 fb.innerHTML=`<b>${ok?"⭕ 정답입니다!":"❌ 아쉽습니다!"}</b><br>${q.e}`;
 fb.classList.remove("hidden");
 document.getElementById("nextBtn").classList.remove("hidden");
}
function nextQuestion(){
 idx++;
 if(idx<qs.length) render(); else finishPhase();
}
function rank(s){
 if(s>=9) return ["🏆 세금 박사","세금에 대한 이해가 아주 높아요!"];
 if(s>=7) return ["🧭 세금 해결사","핵심 개념을 잘 이해하고 있어요."];
 if(s>=5) return ["🔎 세금 탐험가","조금만 더 배우면 세금 해결사!"];
 return ["🌱 세금 새싹","지금부터 하나씩 알아가면 됩니다."];
}
function finishPhase(){
 document.getElementById("quiz").classList.add("hidden");
 if(phase==='pre'){
   preScore=score;
   const r=rank(score);
   document.getElementById("preScore").innerText=`${score} / 10`;
   document.getElementById("preRank").innerText=r[0];
   document.getElementById("preMsg").innerText=r[1];
   document.getElementById("preResult").classList.remove("hidden");
 } else {
   postScore=score; showFinal();
 }
}
function showFinal(){
 document.getElementById("finalResult").classList.remove("hidden");
 const school=document.getElementById("school").value||"학교";
 const grade=document.getElementById("grade").value||"";
 document.getElementById("title").innerText=`${school} ${grade} 학습효과`;
 const gain=postScore-preScore;
 document.getElementById("preCorrect").innerText=`${preScore}개`;
 document.getElementById("postCorrect").innerText=`${postScore}개`;
 document.getElementById("gainCorrect").innerText=`${gain>=0?"+":""}${gain}개`;
 document.getElementById("prePoints").innerText=`${preScore*10}점`;
 document.getElementById("postPoints").innerText=`${postScore*10}점`;
 document.getElementById("gainPoints").innerText=`${gain>=0?"+":""}${gain*10}점`;
 let msg = gain>=3 ? "교육 후 정답 수가 크게 늘었습니다. 맞춤형 세금교육의 학습효과가 뚜렷하게 나타났습니다."
         : gain>=1 ? "교육 후 이해도가 향상되었습니다. 틀린 문항을 중심으로 한 번 더 복습하면 좋습니다."
         : gain===0 ? "사전·사후 점수가 같습니다. 문항별 오답 유형을 확인해 교육 내용을 보완해보세요."
         : "사후 점수가 낮아졌습니다. 문항 난이도, 집중도, 교육 방식 등을 함께 점검해보세요.";
 document.getElementById("finalComment").innerHTML=`<b>교육효과 요약</b><br>${msg}`;
}
function saveResult(){
 const school=document.getElementById("school").value||"미입력";
 const grade=document.getElementById("grade").value||"미입력";
 const student=document.getElementById("student").value||"미입력";
 const gain=postScore-preScore;
 const txt=[
  "찾아가는 맞춤형 세금교실 V3 결과표",
  `학교: ${school}`,`학년: ${grade}`,`학생 식별값: ${student}`,"",
  `사전: ${preScore}/10 (${preScore*10}점)`,
  `사후: ${postScore}/10 (${postScore*10}점)`,
  `향상: ${gain>=0?"+":""}${gain}문항 / ${gain>=0?"+":""}${gain*10}점`
 ].join("\n");
 const blob=new Blob([txt],{type:"text/plain;charset=utf-8"});
 const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
 a.download="세금교실_V3_결과표.txt"; a.click();
}
</script>
</body>
</html>
